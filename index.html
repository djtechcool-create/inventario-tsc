<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventario TSC</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a56db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen active">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <div class="login-logo">TSC</div>
            <h1>Inventario Físico</h1>
            <p>Sistema de Control de Inventarios</p>
          </div>
          <form id="login-form">
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" required autocomplete="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <div id="login-error" class="error-msg" style="display:none"></div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
              <span class="btn-text">Iniciar Sesión</span>
              <span class="btn-loader" style="display:none"></span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div id="admin-screen" class="screen" style="display:none">
      <header class="app-header">
        <div class="header-left">
          <button id="admin-menu-toggle" class="icon-btn" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <h2>Inventario TSC</h2>
        </div>
        <div class="header-right">
          <span id="admin-user-name" class="user-badge"></span>
          <button id="admin-logout" class="icon-btn" aria-label="Salir">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>
      <div class="app-body">
        <nav id="admin-sidebar" class="sidebar">
          <a href="#" class="nav-item active" data-view="dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
          </a>
          <a href="#" class="nav-item" data-view="cycles">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Inventarios
          </a>
          <a href="#" class="nav-item" data-view="import">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Importar Virtual
          </a>
          <a href="#" class="nav-item" data-view="counts">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Conteos
          </a>
          <a href="#" class="nav-item" data-view="compare">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7 7"/><path d="M3 3l7 7"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/><path d="M21 21l-7-7"/><path d="M3 21l7-7"/></svg>
            Comparar
          </a>
          <a href="#" class="nav-item" data-view="recounts">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Reconteos
          </a>
          <a href="#" class="nav-item" data-view="reconcile">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Conciliar
          </a>
          <a href="#" class="nav-item" data-view="reports">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Reportes
          </a>
          <a href="#" class="nav-item" data-view="users">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            Usuarios
          </a>
        </nav>
        <main id="admin-content" class="content">
          <div id="admin-view-dashboard" class="view active"></div>
          <div id="admin-view-cycles" class="view"></div>
          <div id="admin-view-import" class="view"></div>
          <div id="admin-view-counts" class="view"></div>
          <div id="admin-view-compare" class="view"></div>
          <div id="admin-view-recounts" class="view"></div>
          <div id="admin-view-reconcile" class="view"></div>
          <div id="admin-view-reports" class="view"></div>
          <div id="admin-view-users" class="view"></div>
        </main>
      </div>
    </div>

    <div id="bodega-screen" class="screen" style="display:none">
      <header class="app-header bodega-header">
        <div class="header-left">
          <h2>Mi Conteo</h2>
        </div>
        <div class="header-right">
          <span id="bodega-user-name" class="user-badge"></span>
          <button id="bodega-logout" class="icon-btn" aria-label="Salir">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>
      <main class="bodega-content">
        <div id="bodega-view-cycles" class="view active"></div>
        <div id="bodega-view-count" class="view"></div>
        <div id="bodega-view-calculator" class="view"></div>
        <div id="bodega-view-history" class="view"></div>
        <nav class="bodega-nav">
          <button class="bodega-nav-item active" data-view="cycles">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Inventarios
          </button>
          <button class="bodega-nav-item" data-view="count">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Contar
          </button>
          <button class="bodega-nav-item" data-view="history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Historial
          </button>
        </nav>
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none">
      <div class="modal" id="modal-container">
        <div class="modal-header">
          <h3 id="modal-title"></h3>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/bodega.js"></script>
  <script src="js/views/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
